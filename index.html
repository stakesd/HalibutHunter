<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Blackjack">
  <meta name="theme-color" content="#0b3d2a">
  <title>Halibut Hunter Blackjack</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="title">Halibut Hunter <span id="subtitle">Blackjack Trainer</span></div>
    <div class="mode-toggle" role="tablist" aria-label="Mode">
      <button id="mode-play" class="active" type="button">Play</button>
      <button id="mode-drill" type="button">Drill</button>
    </div>
  </header>

  <main>
    <!-- PLAY / DRILL -->
    <section id="view-table" class="view active">
      <div class="scorebar">
        <div><span id="sb-acc">–</span><small>accuracy</small></div>
        <div><span id="sb-streak">0</span><small>streak</small></div>
        <div><span id="sb-bank">£1000</span><small>bankroll</small></div>
      </div>

      <div class="felt">
        <div class="area dealer">
          <div class="label">Dealer <b id="dealer-total"></b></div>
          <div class="cards" id="dealer-cards"></div>
        </div>

        <div id="feedback" class="feedback hidden"></div>

        <div class="area player">
          <div id="player-hands" class="hands"></div>
        </div>
      </div>

      <div id="outcome" class="outcome"></div>

      <div class="controls">
        <div class="actions" id="actions">
          <button data-act="H" class="act hit" type="button">Hit</button>
          <button data-act="S" class="act stand" type="button">Stand</button>
          <button data-act="D" class="act double" type="button">Double</button>
          <button data-act="P" class="act split" type="button">Split</button>
          <button data-act="R" class="act surr" type="button" hidden>Surr.</button>
        </div>
        <div class="row2">
          <button id="btn-hint" class="ghost" type="button">Hint</button>
          <button id="btn-chart" class="ghost" type="button">Chart</button>
          <button id="btn-deal" class="deal" type="button">Deal</button>
        </div>
      </div>
    </section>

    <!-- CHART -->
    <section id="view-chart" class="view">
      <div id="chart"></div>
      <p class="note">Never take insurance.</p>
    </section>

    <!-- STATS -->
    <section id="view-stats" class="view">
      <h3>Table rules</h3>
      <p class="note">Check the sign on your table and match it here.</p>
      <div class="seg">
        <button data-rule="preset:us" type="button">San Juan / US</button>
        <button data-rule="preset:uk" type="button">UK</button>
      </div>
      <div id="us-opts">
        <div class="opt-row"><span>Dealer on soft 17</span>
          <div class="seg small">
            <button data-rule="h17:false" type="button">Stands</button>
            <button data-rule="h17:true" type="button">Hits</button>
          </div>
        </div>
        <div class="opt-row"><span>Surrender</span>
          <div class="seg small">
            <button data-rule="surrender:false" type="button">No</button>
            <button data-rule="surrender:true" type="button">Yes</button>
          </div>
        </div>
      </div>
      <ul class="rules" id="rules-list"></ul>

      <h3>Your stats</h3>
      <div class="stat-grid" id="stat-grid"></div>
      <h3>Most missed</h3>
      <ul id="missed" class="missed"></ul>
      <button id="btn-reset" class="danger" type="button">Reset stats</button>
    </section>
  </main>

  <div id="sheet" class="sheet" aria-label="Strategy chart">
    <div class="sheet-body">
      <div class="sheet-head">Strategy chart <span>Tap anywhere to close</span></div>
      <div id="sheet-chart"></div>
    </div>
  </div>

  <nav class="tabbar">
    <button data-view="table" class="active" type="button"><span>♠</span>Table</button>
    <button data-view="chart" type="button"><span>▦</span>Chart</button>
    <button data-view="stats" type="button"><span>⚙</span>Rules &amp; stats</button>
  </nav>

  <script src="strategy.js"></script>
  <script src="app.js"></script>
</body>
</html>
